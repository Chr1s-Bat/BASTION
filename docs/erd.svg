<text x="560.0" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b3a14">BASTION — Entity Relationship Diagram</text>
<text x="560.0" y="60" text-anchor="middle" font-size="13" fill="#5b6650">5 tables · every relationship is one-to-many (crow's foot = many side)</text>
