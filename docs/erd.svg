<text x="316" y="150" font-size="12" fill="#5b6650" text-anchor="start">registers</text>
<text x="556" y="255" font-size="12" fill="#5b6650" text-anchor="start">classified as</text>
<text x="965" y="330" font-size="12" fill="#5b6650" text-anchor="start">stored at</text>
<text x="632" y="565" font-size="12" fill="#5b6650" text-anchor="start">requested in</text>
<text x="130" y="625" font-size="12" fill="#5b6650" text-anchor="start">requested by</text>
<text x="240" y="675" font-size="12" fill="#5b6650" text-anchor="start">reviewed by</text>
<rect x="860" y="560" width="240" height="190" rx="4" fill="#fffbe8" stroke="#c9a227" stroke-width="1.5"/>
<text x="874" y="584" font-size="12.5" fill="#3b3300" font-weight="bold">Business rules</text>
<text x="874" y="603" font-size="12.5" fill="#3b3300" font-weight="normal">requisition status:</text>
<text x="874" y="622" font-size="12.5" fill="#3b3300" font-weight="normal">pending → approved</text>
<text x="874" y="641" font-size="12.5" fill="#3b3300" font-weight="normal">→ issued → returned</text>
<text x="874" y="660" font-size="12.5" fill="#3b3300" font-weight="normal">or rejected</text>
<text x="874" y="679" font-size="12.5" fill="#3b3300" font-weight="normal">item status:</text>
<text x="874" y="698" font-size="12.5" fill="#3b3300" font-weight="normal">operational | maintenance</text>
<text x="874" y="717" font-size="12.5" fill="#3b3300" font-weight="normal">| decommissioned</text>
<text x="874" y="736" font-size="12.5" fill="#3b3300" font-weight="normal">issue −stock, return +stock</text>
</svg>